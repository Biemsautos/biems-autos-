<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1324"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Biems Autos"><link rel="manifest" href="manifest.json"><link rel="icon" href="biems-logo.png"><title>Biems Autos</title><style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#111827;--muted:#667085;--brand:#0b1324;--accent:#d9a441;--line:#e6e9ef;--ok:#19a463}*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;background:var(--bg);color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;min-height:100vh}.top{background:linear-gradient(135deg,#0b1324,#182642);color:#fff;padding:18px 18px 14px;position:sticky;top:0;z-index:10;box-shadow:0 3px 18px #0002}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:12px;background:#fff1;display:grid;place-items:center;border:1px solid #fff3;font-weight:900;color:var(--accent);overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain}.brand h1{font-size:20px;margin:0}.brand small{color:#c8d1e2}.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:10px 13px;background:#fff;color:#0b1324;font-weight:700}.btn.gold{background:var(--accent)}.btn.dark{background:#17233a;color:#fff;border:1px solid #ffffff20}.content{padding:18px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.stat b{font-size:22px}.stat span{display:block;color:var(--muted);font-size:12px;margin-top:2px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 5px 20px #1018280a}.media{height:175px;background:#e9edf3;position:relative;display:grid;place-items:center;overflow:hidden}.media img,.media video{width:100%;height:100%;object-fit:cover}.badge{position:absolute;left:10px;top:10px;background:#000b;color:#fff;padding:5px 8px;border-radius:99px;font-size:11px}.body{padding:13px}.body h3{margin:0 0 5px;font-size:17px}.price{font-weight:900;color:#0b7a4b;font-size:18px}.meta{color:var(--muted);font-size:12px;margin:6px 0 12px}.row{display:flex;gap:7px;flex-wrap:wrap}.row .btn{flex:1;min-width:100px;border:1px solid var(--line);background:#fff}.row .btn.gold{background:var(--accent);border-color:var(--accent)}.empty{background:#fff;border:1px dashed #ccd3df;border-radius:16px;padding:40px;text-align:center;color:var(--muted)}.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.open{display:flex}.sheet{background:#fff;width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:18px}.sheet h2{margin-top:0}.form{display:grid;gap:11px}.form label{font-size:12px;font-weight:800;color:#475467}.form input,.form textarea,.form select{width:100%;border:1px solid #d5dae3;border-radius:10px;padding:11px;background:#fff}.form textarea{min-height:80px;resize:vertical}.preview{display:flex;gap:8px;overflow:auto}.preview img,.preview video{width:105px;height:78px;object-fit:cover;border-radius:8px;background:#eee}.quote{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:14px;white-space:pre-wrap}.footer{padding:30px 18px 100px;text-align:center;color:var(--muted);font-size:12px}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;gap:8px;padding:8px;z-index:20}.nav button{border:0;background:transparent;padding:9px 14px;border-radius:10px;font-weight:700}.nav button.active{background:#eef1f6}@media(min-width:800px){.nav{position:sticky;bottom:0}.modal{align-items:center}.sheet{border-radius:20px}}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo" id="logoBox"><img src="biems-logo.png" alt="Biems Autos logo"></div><div><h1>Biems Autos</h1><small>Cars • Photos • Videos • Quotations</small></div></div><div class="actions"><button class="btn gold" onclick="openAdd()">＋ Add Vehicle</button><button class="btn dark" onclick="openQuote()">Create Quotation</button><button class="btn dark" onclick="installApp()" id="installBtn" style="display:none">Install App</button></div></header><main class="content"><section class="stats"><div class="stat"><b id="count">0</b><span>Vehicles</span></div><div class="stat"><b id="value">₦0</b><span>Listed value</span></div><div class="stat"><b id="mediaCount">0</b><span>Photos / videos</span></div></section><div id="inventory" class="grid"></div><div id="empty" class="empty" style="display:none">No vehicles yet.<br><br><button class="btn gold" onclick="openAdd()">Add your first vehicle</button></div></main><footer class="footer">Biems Autos • Your vehicle sales dashboard<br>Data is stored on this device in the app.</footer></div><nav class="nav"><button class="active" onclick="scrollTop()">🏠 Home</button><button onclick="openAdd()">🚘 Add Car</button><button onclick="openQuote()">🧾 Quotation</button></nav>
<div class="modal" id="vehicleModal"><div class="sheet"><h2 id="vehicleTitle">Add Vehicle</h2><div class="form"><label>Make / model<input id="vName" placeholder="e.g. Lexus RX 350"></label><label>Year<input id="vYear" type="number" placeholder="2017"></label><label>Price (₦)<input id="vPrice" type="number" placeholder="25000000"></label><label>Mileage<input id="vMileage" placeholder="85,000 km"></label><label>Description<textarea id="vDesc" placeholder="Condition, features, location..."></textarea></label><label>Photos & videos<input id="vMedia" type="file" accept="image/*,video/*" multiple></label><div class="preview" id="preview"></div><div class="row"><button class="btn" onclick="closeModal('vehicleModal')">Cancel</button><button class="btn gold" onclick="saveVehicle()">Save Vehicle</button></div></div></div></div>
<div class="modal" id="quoteModal"><div class="sheet"><h2>Client Quotation</h2><div class="form"><label>Client name<input id="qClient" placeholder="Client name"></label><label>Client WhatsApp number<input id="qPhone" placeholder="2348012345678"></label><label>Select vehicle<select id="qVehicle"></select></label><label>Quantity / units<input id="qQty" type="number" min="1" value="1"></label><label>Additional note<textarea id="qNote" placeholder="Optional delivery or negotiation note"></textarea></label><div class="quote" id="quotePreview">Select a vehicle to generate the quotation.</div><div class="row"><button class="btn" onclick="closeModal('quoteModal')">Close</button><button class="btn gold" onclick="sendWhatsApp()">Send via WhatsApp</button></div></div></div></div>
<script>
const KEY='biemsAutosInventoryV1';let vehicles=JSON.parse(localStorage.getItem(KEY)||'[]');let editId=null;let deferredPrompt=null;
const naira=n=>new Intl.NumberFormat('en-NG',{style:'currency',currency:'NGN',maximumFractionDigits:0}).format(Number(n)||0);
function persist(){localStorage.setItem(KEY,JSON.stringify(vehicles));render()}
function render(){document.getElementById('count').textContent=vehicles.length;document.getElementById('value').textContent=naira(vehicles.reduce((s,v)=>s+Number(v.price||0),0));document.getElementById('mediaCount').textContent=vehicles.reduce((s,v)=>s+(v.media?.length||0),0);const box=document.getElementById('inventory');box.innerHTML='';document.getElementById('empty').style.display=vehicles.length?'none':'block';vehicles.forEach(v=>{const c=document.createElement('article');c.className='card';let m=v.media?.[0];c.innerHTML=`<div class="media">${m?(m.type.startsWith('video')?`<video src="${m.data}" controls></video>`:`<img src="${m.data}" alt="${esc(v.name)}">`):'<span>No media</span>'}<span class="badge">${v.year||''}</span></div><div class="body"><h3>${esc(v.name)}</h3><div class="price">${naira(v.price)}</div><div class="meta">${esc(v.mileage||'')} ${v.mileage?'• ':''}${esc(v.desc||'')}</div><div class="row"><button class="btn gold" onclick="openQuote('${v.id}')">Quote</button><button class="btn" onclick="editVehicle('${v.id}')">Edit</button><button class="btn" onclick="deleteVehicle('${v.id}')">Delete</button></div></div>`;box.appendChild(c)})}
function esc(s=''){return String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[x]))}
function openAdd(){editId=null;document.getElementById('vehicleTitle').textContent='Add Vehicle';['vName','vYear','vPrice','vMileage','vDesc'].forEach(id=>document.getElementById(id).value='');document.getElementById('vMedia').value='';document.getElementById('preview').innerHTML='';document.getElementById('vehicleModal').classList.add('open')}
function editVehicle(id){const v=vehicles.find(x=>x.id===id);if(!v)return;editId=id;document.getElementById('vehicleTitle').textContent='Edit Vehicle';document.getElementById('vName').value=v.name||'';document.getElementById('vYear').value=v.year||'';document.getElementById('vPrice').value=v.price||'';document.getElementById('vMileage').value=v.mileage||'';document.getElementById('vDesc').value=v.desc||'';document.getElementById('preview').innerHTML=(v.media||[]).map(m=>m.type.startsWith('video')?`<video src="${m.data}" controls></video>`:`<img src="${m.data}">`).join('');document.getElementById('vehicleModal').classList.add('open')}
async function saveVehicle(){const name=vName.value.trim();if(!name||!vPrice.value){alert('Please enter the vehicle name and price.');return}let media=[];const files=[...vMedia.files];for(const f of files){if(f.size>18*1024*1024){alert(f.name+' is too large. Keep files under 18MB each.');continue}media.push({type:f.type,data:await fileData(f)})}let old=editId&&vehicles.find(v=>v.id===editId);const obj={id:editId||Date.now().toString(),name,year:vYear.value,price:Number(vPrice.value),mileage:vMileage.value,desc:vDesc.value,media:media.length?media:(old?.media||[])};if(editId)vehicles=vehicles.map(v=>v.id===editId?obj:v);else vehicles.unshift(obj);persist();closeModal('vehicleModal')}
function fileData(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function deleteVehicle(id){if(confirm('Delete this vehicle from Biems Autos?')){vehicles=vehicles.filter(v=>v.id!==id);persist()}}
function closeModal(id){document.getElementById(id).classList.remove('open')}
function openQuote(id){const s=document.getElementById('qVehicle');s.innerHTML=vehicles.map(v=>`<option value="${v.id}">${esc(v.name)} — ${naira(v.price)}</option>`).join('');if(id)s.value=id;['qClient','qPhone','qNote'].forEach(x=>document.getElementById(x).value='');document.getElementById('qQty').value=1;document.getElementById('quoteModal').classList.add('open');updateQuote()}
['qVehicle','qQty','qClient','qNote'].forEach(id=>document.getElementById(id).addEventListener('input',updateQuote));
function getQuoteText(){const v=vehicles.find(x=>x.id===qVehicle.value);if(!v)return '';const qty=Math.max(1,Number(qQty.value)||1);return `BIEMS AUTOS\nVEHICLE QUOTATION\n\nClient: ${qClient.value||'Valued Client'}\nVehicle: ${v.name}${v.year?' ('+v.year+')':''}\nPrice per vehicle: ${naira(v.price)}\nQuantity: ${qty}\nTotal: ${naira(v.price*qty)}\n${v.mileage?'Mileage: '+v.mileage+'\n':''}${qNote.value?'Note: '+qNote.value+'\n':''}\nThank you for choosing Biems Autos.`}
function updateQuote(){document.getElementById('quotePreview').textContent=getQuoteText()||'Select a vehicle to generate the quotation.'}
function sendWhatsApp(){const phone=qPhone.value.replace(/\D/g,'');if(!phone){alert('Enter the client WhatsApp number with country code, e.g. 2348012345678.');return}const text=encodeURIComponent(getQuoteText());window.open(`https://wa.me/${phone}?text=${text}`,'_blank')}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-block'});async function installApp(){if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none'}else alert('On Android, use your browser menu and choose “Add to Home screen” or “Install app”. Once installed, Biems Autos opens like an app without the browser address bar.')}
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));render();
</script></body></html>
